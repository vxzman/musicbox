<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sing-box 立体开口六边形盒子（深色浏览器主题）：
       同一几何，亮面配色，深紫色底砖 -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#4f378b"/>
  <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="#eaddff" stroke-width="3"/>
  <polygon points="50,15 85,32 85,68 50,85 15,68 15,32" fill="#2a1e44"/>
  <!-- 顶面 -->
  <polygon points="50,15 85,32 50,45 15,32" fill="#f8f4ff"/>
  <!-- 左侧面 -->
  <polygon points="15,32 50,45 50,85 15,68" fill="#cdbaf3"/>
  <!-- 右侧面 -->
  <polygon points="85,32 50,45 50,85 85,68" fill="#a68ae8"/>
  <!-- 高光 -->
  <polygon points="85,32 85,68 75,73 75,37" fill="#e3d4fb" opacity="0.5"/>
  <!-- 开口暗面 -->
  <polygon points="50,45 75,37 50,55 25,45" fill="#241a3e" opacity="0.85"/>
</svg>
