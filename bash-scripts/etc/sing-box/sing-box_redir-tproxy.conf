# Sing-Box Redir-TProxy (MIX) Mode Environment Variables
# TCP REDIRECT + UDP TPROXY hybrid mode

REDIRECT_PORT=22025           # TCP traffic redirect port
TPROXY_PORT=22026             # UDP traffic TProxy port

# Proxy process GID, usually the group ID of the sing-box user
# deploy.sh install 会自动对齐为实际 gid
EXCLUDE_GID=988

# Firewall mark and routing table ID
FWMARK=1
TABLE_ID=100

# nftables table name
NFTABLES_TABLE=sing-box_redir_tproxy4
