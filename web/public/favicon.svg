<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- MusicBox 八音盒图标（浅色浏览器主题）：
       MD3 种子 #6750A4，立方形态 + 晶莹八音盒音符与旋律声波 -->
  <defs>
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#eaddff"/>
    </linearGradient>
    <linearGradient id="mb-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff"/>
      <stop offset="100%" stop-color="#b69ce6"/>
    </linearGradient>
    <linearGradient id="mb-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6fd0"/>
      <stop offset="100%" stop-color="#7354c0"/>
    </linearGradient>
    <linearGradient id="mb-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750a4"/>
      <stop offset="100%" stop-color="#4f378b"/>
    </linearGradient>
    <filter id="mb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#381e72" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆角底砖 -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#mb-bg)" stroke="#d0bcff" stroke-width="1.5"/>
  <!-- 3D 音乐盒立方体 -->
  <g filter="url(#mb-shadow)">
    <!-- 顶面 -->
    <polygon points="50,18 82,34 50,50 18,34" fill="url(#mb-top)"/>
    <!-- 左侧面 -->
    <polygon points="18,34 50,50 50,82 18,66" fill="url(#mb-left)"/>
    <!-- 右侧面 -->
    <polygon points="50,50 82,34 82,66 50,82" fill="url(#mb-right)"/>
    <!-- 高光棱线 -->
    <polyline points="18,34 50,50 82,34" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="50" y2="82" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
  </g>
  <!-- 晶莹纯白八音符（双连音符 ♫） -->
  <g fill="#ffffff" filter="drop-shadow(0 2px 3px rgba(33, 0, 93, 0.4))">
    <!-- 左音符头 -->
    <ellipse cx="38" cy="62" rx="7.5" ry="5.5" transform="rotate(-20 38 62)"/>
    <!-- 右音符头 -->
    <ellipse cx="58" cy="54" rx="7.5" ry="5.5" transform="rotate(-20 58 54)"/>
    <!-- 左符干 -->
    <rect x="43" y="30" width="3.5" height="32" rx="1.5"/>
    <!-- 右符干 -->
    <rect x="63" y="22" width="3.5" height="32" rx="1.5"/>
    <!-- 符梁 -->
    <polygon points="43,30 66.5,22 66.5,28 43,36"/>
  </g>
  <!-- 旋律弧光声波 -->
  <path d="M 72,16 A 12 12 0 0 1 80,28" stroke="#6750a4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 78,11 A 19 19 0 0 1 90,29" stroke="#6750a4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
